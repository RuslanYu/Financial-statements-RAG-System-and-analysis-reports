logging:
  log_dir: logs
  filename: financial_rag.log
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

models:
  embeddings:
    name: "intfloat/multilingual-e5-small"
    device: "cpu"
    normalize: true
  llm:
    name: "gpt-4"
    temperature: 0.0
    max_tokens: 1024

retrieval:
  top_k: 8
  dense_weight: 0.7
  use_reranking: true
  min_score: 0.2

processing:
  chunk_size: 1000
  chunk_overlap: 200
  ocr_languages: "eng+heb"

storage:
  index_dir: "data/indices"
  embeddings_cache: "data/embeddings_cache"

interface:
  gui:
    width: 1000
    height: 800
    theme: "clam"